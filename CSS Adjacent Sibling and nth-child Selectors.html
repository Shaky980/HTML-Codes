<!DOCTYPE html>
<html>

  <head>
    <title>CSS Adjacent Sibling and nth-child Selectors</title>

    <style>
      h1 + p {
        color: cyan;
        font-weight: 100;
        font-family: fantasy;
      }

      li {
        color: red;
      }

      li:nth-child(1) {
        color: blue;
      }

      li:nth-child(3) {
        background-color: white;
      }
    </style>
  </head>

  <body>

    <h1>Codingal</h1>

    <p>This is a paragraph</p>

    <ul>
      <li>Toji</li>
      <li>Megumi</li>
      <li>Gojo</li>
    </ul>

  </body>

</html>

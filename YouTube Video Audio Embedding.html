<!DOCTYPE html>
<html>
<head>
    <title>HTML YouTube Video and Audio Embedding with Iframe and Audio Elements</title>
</head>

<body>

    <h2>YouTube Video</h2>

    <iframe
        width="420"
        height="315"
        src="https://www.youtube.com/embed/_UY0Fg7z5Qk?loop=1&playlist=_UY0Fg7z5Qk"
        title="YouTube Video"
        allowfullscreen>
    </iframe>

    <h2>Audio</h2>

    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

</body>
</html>
